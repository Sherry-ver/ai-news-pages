<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日报 - 2026-09-22</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 12px;
            margin-bottom: 24px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header h1 {
            font-size: 2.2em;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .header .subtitle {
            font-size: 0.95em;
            opacity: 0.9;
            margin-top: 6px;
        }
        .header .meta {
            font-size: 0.85em;
            opacity: 0.75;
            margin-top: 12px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 16px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .num {
            font-size: 1.8em;
            font-weight: 700;
        }
        .stat-item .label {
            font-size: 0.8em;
            opacity: 0.8;
        }
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .news-card {
            background: white;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .news-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .news-card .source-tag {
            display: inline-block;
            background: #eef2f7;
            color: #667eea;
            font-size: 0.75em;
            padding: 2px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .news-card h2 {
            font-size: 1.15em;
            margin-bottom: 8px;
            line-height: 1.5;
        }
        .news-card h2 a {
            color: #1a1a2e;
            text-decoration: none;
        }
        .news-card h2 a:hover {
            color: #667eea;
        }
        .news-card .summary {
            color: #666;
            font-size: 0.92em;
            line-height: 1.7;
            margin-bottom: 12px;
        }
        .news-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8em;
            color: #999;
        }
        .news-card .read-more {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        .news-card .read-more:hover {
            text-decoration: underline;
        }
        .footer-area {
            text-align: center;
            padding: 30px 0 20px;
            color: #999;
            font-size: 0.85em;
        }
        .footer-area a {
            color: #667eea;
            text-decoration: none;
        }
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        .empty .icon {
            font-size: 3em;
            margin-bottom: 16px;
        }
        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }
            .header {
                padding: 30px 20px;
            }
            .header h1 {
                font-size: 1.6em;
            }
            .news-card {
                padding: 18px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>AI 日报</h1>
        <div class="subtitle">人工智能热点新闻速递</div>
        <div class="meta">2026-09-21 16:00 ~ 2026-09-22 16:00</div>
        <div class="stats">
            <div class="stat-item">
                <div class="num">0</div>
                <div class="label">今日新闻</div>
            </div>
            <div class="stat-item">
                <div class="num">2026-09-22</div>
                <div class="label">发布日期</div>
            </div>
        </div>
    </div>
    
    <div class="news-list">

        <div class="empty">
            <div class="icon">📡</div>
            <p>今日暂未收集到AI相关新闻</p>
        </div>

    </div>
    
    <div class="footer-area">
        <p>由 TeleAgent AI日报技能 自动生成 | <a href="https://github.com">GitHub Pages 托管</a></p>
        <p>每日16:05自动推送</p>
    </div>
</div>
</body>
</html>
